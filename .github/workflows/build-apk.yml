# Builds the APK on GitHub's servers every time the code changes.
# Download it from: repository -> Actions -> latest run -> Artifacts -> ePOS-T2K-apk
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        # The runner already has the Android SDK installed (ANDROID_HOME).
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ePOS-T2K-apk
          path: app/build/outputs/apk/debug/ePOS-T2K.apk
