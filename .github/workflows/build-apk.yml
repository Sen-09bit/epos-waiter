# Builds the APK on GitHub's servers every time the code changes.
# Download it from: repository -> Actions -> latest run -> Artifacts -> ePOS-T2K-apk
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.EPOS_KEYSTORE_BASE64 }}
          EPOS_KEYSTORE_PASSWORD: ${{ secrets.EPOS_KEYSTORE_PASSWORD }}
          EPOS_KEY_ALIAS: ${{ secrets.EPOS_KEY_ALIAS }}
        # The runner already has the Android SDK installed (ANDROID_HOME).
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export EPOS_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            # Drop any stray characters pasted into the secrets (spaces, hidden or curly characters)
            export EPOS_KEYSTORE_PASSWORD="$(printf %s "$EPOS_KEYSTORE_PASSWORD" | LC_ALL=C tr -cd "A-Za-z0-9")"
            export EPOS_KEY_ALIAS="$(printf %s "$EPOS_KEY_ALIAS" | LC_ALL=C tr -cd "A-Za-z0-9._-")"
            echo "Password length after cleanup: ${#EPOS_KEYSTORE_PASSWORD} (should be 24)"
            gradle assembleRelease --stacktrace
            cp app/build/outputs/apk/release/ePOS-T2K.apk out/
            echo "Signed release APK built."
          else
            echo "::warning::Signing secrets are not set - building a debug APK (updates will not install over each other)."
            gradle assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/ePOS-T2K.apk out/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ePOS-T2K-apk
          path: out/ePOS-T2K.apk
